# energy-hub configuration
# Environment variables override any value here (prefix: EH_)
# e.g. EH_MQTT_PASSWORD, EH_ANKER_USER, EH_ANKER_PASSWORD, EH_ANKER_COUNTRY

mqtt:
  broker: 192.168.1.34
  port: 1883
  username: mqttu
  password: ""  # use EH_MQTT_PASSWORD env var
  keepalive: 60
  client_id: energy-hub

# Anker Solix cloud bridge (optional — omit or leave user empty to disable)
anker:
  user: ""       # use EH_ANKER_USER env var
  password: ""   # use EH_ANKER_PASSWORD env var
  country: "DE"  # use EH_ANKER_COUNTRY env var
  meter_sn: ""          # auto-detect if blank
  solarbank_sn: ""      # auto-detect if blank
  trigger_timeout: 60   # seconds the realtime trigger stays active
  meter_trigger_interval: 60    # seconds between A17X7 trigger renewals
  solarbank_status_interval: 5  # seconds between A17C5 status requests

# Input topics (raw sensor data)
sources:
  tasmota_pv:
    topic: tele/tasmota_pv/SENSOR
    stale_timeout: 120  # seconds before marking stale
  tasmota_grid:
    topic: tele/tasmota_grid/SENSOR
    stale_timeout: 120
    failback_after: 60  # after an outage, Tasmota must deliver for 60 s before it replaces Anker again
  anker:
    topic: anker/solix/live/system
    stale_timeout: 300  # Anker updates less frequently
  charger:
    topic: go-eCharger/253899/nrg
    stale_timeout: 300

# Output topics (clean aggregated data)
output:
  prefix: energy
  # Individual topics are: {prefix}/grid, {prefix}/pv/roof, etc.
  publish_interval: 10      # seconds between aggregated publishes
  health_interval: 60       # seconds between health publishes
  retain: true              # retain state topics (grid, pv, battery, etc.)

# Plausibility limits for the Tasmota SML sensors (see energy_hub/validation.py).
# Readings are rejected for physically impossible values. Counter jumps and large
# power jumps are held until a second reading confirms them, so a single garbage
# value never reaches the output and a poisoned baseline recovers within two
# readings. Device timestamps and WiFi gaps never cause rejections.
validation:
  max_total_energy: 150000.0   # kWh, any cumulative counter
  max_power: 30000.0           # W, grid import ceiling
  grid_min_power: -5600.0      # W, grid export floor (max export, negative)
  pv_max_power: 5600.0         # W, PV generation ceiling
  grid_min_total_in: 42000.0   # kWh, floor for the first grid reading after start
  grid_min_total_out: 28484.0  # kWh, floor for the first grid reading after start
  pv_min_total_in: 60000.0     # kWh, floor for the first PV reading after start
  meter_noise_tolerance: 0.1   # kWh, allowed backwards jitter
  rate_safety_factor: 2.0      # energy may rise at most max_power * elapsed * factor
  power_jump_confirm: 3000.0   # W, power jumps larger than this need a confirming 2nd reading (0 = off)
  max_consecutive_errors: 10   # last-resort: progression failures before forced re-baseline
  quality_check_window: 20     # rolling window of readings for the quality ratio
  quality_alert_threshold: 0.5 # alert when more than this fraction was rejected
  clock_offset_warn: 60        # s, warn (and stop trusting device time) beyond this
  max_alignment_skew: 30       # s, skip sample alignment if the reference is older

# Gas impulse counter (Zigbee2MQTT BK4 meter via door/contact sensor)
gas:
  impulse_topic: zigbee2mqtt/GasImpulsCounter
  sync_topic: energy/gas/set        # publish {"volume_m3": 12345.67} here to sync
  publish_topic: energy/gas
  state_file: gas_state.json        # persisted impulse counter
  impulse_m3: 0.01                  # m³ per tick (BK4)
  retain: true

# Stale data policy
stale_policy:
  grace_period: 300   # seconds — use last known value, flag stale
  zero_after: 300     # seconds — zero out power contribution

# Alerting
alerts:
  enabled: true
  webhook_url: ""  # e.g. https://ntfy.sh/your-topic
  webhook_title: Energy Hub
  backoff_stages:
    - 3600    # 1 hour
    - 43200   # 12 hours
    - 172800  # 2 days
    - 604800  # 1 week

# Logging
logging:
  file: energy_hub.log
  max_bytes: 5242880  # 5 MB
  backup_count: 3
  level: INFO
