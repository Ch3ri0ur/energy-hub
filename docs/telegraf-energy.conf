# Telegraf drop-in for energy-hub.
#
# Put this on the machine that runs Telegraf, typically as
#   /etc/telegraf/telegraf.d/energy-hub.conf
#
# It contains ONLY the energy-hub MQTT inputs. Keep [agent] and your
# [[outputs.influxdb_v2]] in the main telegraf.conf (a second copy here would
# duplicate the agent section and double-write every metric). Telegraf's
# environment must provide EH_MQTT_PASSWORD (e.g. via
# /etc/default/telegraf or a systemd drop-in EnvironmentFile).
#
# The hub publishes energy/aggregated, energy/health and energy/gas at QoS 1,
# so with qos = 1 + persistent_session the broker queues them while Telegraf
# is down (the retained energy/* topics are re-delivered on reconnect either
# way).

# All fields are optional: energy-hub omits values of dead sources and unknown counters
# (never null, never a fake 0). Former tags (battery_state, grid_source, status) are string
# fields since 2026-10-12 with new names, so they don't split series nor collide with the
# old tag columns in Flux pivots.

# =============================================================================
# energy-hub — real-time aggregated snapshot
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/aggregated"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub"
  qos = 1   # with persistent_session the broker queues messages while Telegraf is down

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "energy"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    # Grid
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.power"
      rename = "grid_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.import_w"
      rename = "grid_import"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.export_w"
      rename = "grid_export"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_import"
      rename = "grid_energy_in"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_export"
      rename = "grid_energy_out"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.source"
      rename = "grid_power_source"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_source"
      rename = "grid_energy_source"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.stale"
      rename = "grid_stale"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.dead"
      rename = "grid_dead"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_stale"
      rename = "grid_energy_stale"
      type = "bool"
      optional = true

    # PV
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.power"
      rename = "pv_roof_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.energy"
      rename = "pv_roof_energy"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.stale"
      rename = "pv_roof_stale"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.dead"
      rename = "pv_roof_dead"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.power"
      rename = "pv_balcony_generation"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.output_power"
      rename = "pv_balcony_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total.power"
      rename = "pv_total_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total.generation"
      rename = "pv_generation"
      type = "float"
      optional = true

    # Battery (Solarbank; battery.stale/dead also cover pv_balcony)
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.soc"
      rename = "battery_soc"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.power"
      rename = "battery_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.charge_w"
      rename = "battery_charge"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.discharge_w"
      rename = "battery_discharge"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.ac_charge_w"
      rename = "battery_ac_charge"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.energy_wh"
      rename = "battery_energy_wh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.state"
      rename = "battery_status"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.stale"
      rename = "solarbank_stale"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.dead"
      rename = "solarbank_dead"
      type = "bool"
      optional = true

    # Charger & house
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.power"
      rename = "charger_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.raw_power"
      rename = "charger_raw_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.dead"
      rename = "charger_dead"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "house.power"
      rename = "house_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "house.dead"
      rename = "house_dead"
      type = "bool"
      optional = true

    # Totals (omitted when balance_dead)
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "consumption"
      rename = "consumption"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_consumption_pct"
      rename = "self_consumption_pct"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_sufficiency_pct"
      rename = "self_sufficiency_pct"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "balance_dead"
      rename = "balance_dead"
      type = "bool"
      optional = true

# =============================================================================
# energy-hub — health
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/health"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub_health"
  qos = 1   # with persistent_session the broker queues messages while Telegraf is down

  [[inputs.mqtt_consumer.json_v2]]
    # No timestamp_path: the retained Last Will ("offline") has no timestamp and must be
    # recorded too; health points get the arrival time.
    measurement_name = "energy_health"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      rename = "uptime"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "connected"
      rename = "connected"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "anker_plugin_alive"
      rename = "anker_plugin_alive"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "status"
      rename = "hub_status"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.active_grid_source"
      rename = "active_grid_source"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.pv_roof.age"
      rename = "pv_roof_age"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.grid_tasmota.age"
      rename = "grid_tasmota_age"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.grid_anker.age"
      rename = "grid_anker_age"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.solarbank.age"
      rename = "solarbank_age"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.charger.age"
      rename = "charger_age"
      type = "float"
      optional = true


# =============================================================================
# energy-hub — gas meter (BK4, 0.01 m³/impulse via Zigbee2MQTT)
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/gas"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub_gas"
  qos = 1   # with persistent_session the broker queues messages while Telegraf is down

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "gas"
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "volume_m3"
      rename = "volume_m3"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "impulse_count"
      rename = "impulse_count"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery"
      rename = "battery_pct"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_low"
      rename = "battery_low"
      type = "bool"
      optional = true
