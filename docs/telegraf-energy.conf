# Telegraf drop-in for energy-hub.
#
# Put this on the machine that runs Telegraf, typically as
#   /etc/telegraf/telegraf.d/energy-hub.conf
#
# It contains ONLY the energy-hub MQTT inputs. Keep [agent] and your
# [[outputs.influxdb_v2]] in the main telegraf.conf (a second copy here would
# duplicate the agent section and double-write every metric). Telegraf's
# environment must provide EH_MQTT_PASSWORD (e.g. via
# /etc/default/telegraf or a systemd drop-in EnvironmentFile).
#
# qos = 1 is required for persistent_session to have any effect (Telegraf
# ignores it at QoS 0); the retained energy/* topics are re-delivered on
# reconnect either way.

# =============================================================================
# energy-hub — real-time aggregated snapshot
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/aggregated"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub"
  qos = 1

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "energy"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    # Grid
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.power"
      rename = "grid_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.import_w"
      rename = "grid_import"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.export_w"
      rename = "grid_export"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_import"
      rename = "grid_energy_in"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_export"
      rename = "grid_energy_out"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "grid.source"
      rename = "grid_source"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.stale"
      rename = "grid_stale"
      type = "bool"

    # PV
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.power"
      rename = "pv_roof_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.energy"
      rename = "pv_roof_energy"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.power"
      rename = "pv_balcony_generation"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.output_power"
      rename = "pv_balcony_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.pv_1_power"
      rename = "pv_balcony_pv1"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.pv_2_power"
      rename = "pv_balcony_pv2"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total.power"
      rename = "pv_total_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total.generation"
      rename = "pv_generation"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.stale"
      rename = "pv_roof_stale"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.stale"
      rename = "pv_balcony_stale"
      type = "bool"

    # Battery
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.soc"
      rename = "battery_soc"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.power"
      rename = "battery_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.charge_w"
      rename = "battery_charge"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.discharge_w"
      rename = "battery_discharge"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.energy_wh"
      rename = "battery_energy_wh"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "battery.state"
      rename = "battery_state"

    # Charger & house
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.power"
      rename = "charger_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.raw_power"
      rename = "charger_raw_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "house.power"
      rename = "house_power"
      type = "float"

    # Totals
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "consumption"
      rename = "consumption"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_consumption_pct"
      rename = "self_consumption_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_sufficiency_pct"
      rename = "self_sufficiency_pct"
      type = "float"

# =============================================================================
# energy-hub — health
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/health"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub_health"
  qos = 1

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "energy_health"
    # No timestamp_path here: the Last Will ("status": "offline") is registered
    # at connect time and cannot carry the time of death, and json_v2 drops any
    # message whose timestamp path is missing or null.  Health arrives every
    # 60 s, so the arrival time is accurate enough.

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "connected"
      type = "boolean"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "anker_plugin_alive"
      type = "boolean"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "status"    # ok | degraded | offline (Last Will when the hub dies)
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sources.active_grid_source"
      rename = "active_grid_source"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.pv_roof.age"
      rename = "pv_roof_age"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.grid_tasmota.age"
      rename = "grid_tasmota_age"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.pv_roof.quality"
      rename = "pv_roof_quality"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sources.grid_tasmota.quality"
      rename = "grid_tasmota_quality"
      type = "float"

# =============================================================================
# energy-hub — gas meter (BK4, 0.01 m³/impulse via Zigbee2MQTT)
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/gas"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub_gas"
  qos = 1

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "gas"
    timestamp_path = "ts"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "volume_m3"
      rename = "volume_m3"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "impulse_count"
      rename = "impulse_count"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery"
      rename = "battery_pct"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_low"
      rename = "battery_low"
      type = "boolean"
