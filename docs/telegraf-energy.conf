# Telegraf drop-in for energy-hub.
#
# Put this on the machine that actually runs Telegraf, typically as:
#   /etc/telegraf/telegraf.d/energy-hub.conf
#
# Keep your global [agent] and [[outputs.influxdb_v2]] config in the main
# Telegraf config. This file should only contain the energy-hub MQTT inputs.

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "1s"
  omit_hostname = true
  skip_processors_after_aggregators = true

[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.53:8086"]
  token = "$INFLUX_TOKEN"
  organization = "home"
  bucket = "home"
  content_encoding = "gzip"
  timeout = "10s"

# =============================================================================
# energy-hub — real-time aggregated snapshot
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/aggregated"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub"
  qos = 0

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "energy"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    # Grid
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.power"
      rename = "grid_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.import_w"
      rename = "grid_import"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.export_w"
      rename = "grid_export"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_import"
      rename = "grid_energy_in"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_export"
      rename = "grid_energy_out"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "grid.source"
      rename = "grid_source"

    # PV
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.power"
      rename = "pv_roof_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.energy"
      rename = "pv_roof_energy"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.power"
      rename = "pv_balcony_generation"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.output_power"
      rename = "pv_balcony_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total.power"
      rename = "pv_total_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total.generation"
      rename = "pv_generation"
      type = "float"

    # Battery
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.soc"
      rename = "battery_soc"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.power"
      rename = "battery_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.charge_w"
      rename = "battery_charge"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.discharge_w"
      rename = "battery_discharge"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.energy_wh"
      rename = "battery_energy_wh"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "battery.state"
      rename = "battery_state"

    # Charger & house
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.power"
      rename = "charger_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.raw_power"
      rename = "charger_raw_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "house.power"
      rename = "house_power"
      type = "float"

    # Totals
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "consumption"
      rename = "consumption"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_consumption_pct"
      rename = "self_consumption_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_sufficiency_pct"
      rename = "self_sufficiency_pct"
      type = "float"

# =============================================================================
# energy-hub — health
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/health"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub_health"
  qos = 0

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "energy_health"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "connected"
      type = "boolean"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "anker_plugin_alive"
      type = "boolean"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "status"

# =============================================================================
# energy-hub — gas meter (BK4, 0.01 m³/impulse via Zigbee2MQTT)
# =============================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  topics = ["energy/gas"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"
  data_format = "json_v2"
  persistent_session = true
  client_id = "telegraf_energy_hub_gas"
  qos = 0

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "gas"
    timestamp_path = "ts"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "volume_m3"
      rename = "volume_m3"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "impulse_count"
      rename = "impulse_count"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery"
      rename = "battery_pct"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_low"
      rename = "battery_low"
      type = "boolean"
