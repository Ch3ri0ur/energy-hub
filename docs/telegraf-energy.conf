# Telegraf input for energy-hub → InfluxDB
#
# Subscribes to the aggregated blob and writes to InfluxDB.
# Deploy alongside your existing Telegraf instance.

[[inputs.mqtt_consumer]]
  servers = ["tcp://192.168.1.34:1883"]
  username = "mqttu"
  password = "${EH_MQTT_PASSWORD}"

  topics = [
    "energy/aggregated",
    "energy/health",
  ]

  qos = 0
  persistent_session = false
  client_id = "telegraf-energy-hub"

  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "energy/+"
    measurement = "measurement/_"
    tags = "_/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "energy"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    # Grid
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.power"
      rename = "grid_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_import"
      rename = "grid_energy_import"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "grid.energy_export"
      rename = "grid_energy_export"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "grid.source"
      rename = "grid_source"

    # PV roof
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.power"
      rename = "pv_roof_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_roof.energy"
      rename = "pv_roof_energy"
      type = "float"

    # PV balcony
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.power"
      rename = "pv_balcony_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_balcony.output_power"
      rename = "pv_balcony_output"
      type = "float"

    # PV total
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total.power"
      rename = "pv_total_power"
      type = "float"

    # Battery
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.soc"
      rename = "battery_soc"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.power"
      rename = "battery_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery.energy_wh"
      rename = "battery_energy_wh"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "battery.state"
      rename = "battery_state"

    # Charger
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "charger.power"
      rename = "charger_power"
      type = "float"

    # House
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "house.power"
      rename = "house_power"
      type = "float"

    # Aggregates
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "consumption"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_consumption_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "self_sufficiency_pct"
      type = "float"
