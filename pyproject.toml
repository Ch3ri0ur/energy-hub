[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-hub"
version = "0.1.0"
description = "Unified home energy sensor aggregator"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "anker-solix-api",
    # anker-solix-api declares its dependencies only for poetry, which uv cannot
    # read from the editable path source, so list them here explicitly.
    "aiofiles>=25.1",
    "cryptography>=42",
]

[tool.setuptools.packages.find]
include = ["energy_hub*"]

[project.scripts]
energy-hub = "energy_hub.main:main"

[tool.uv.sources]
anker-solix-api = { path = "../anker-solix-api", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
ignore = ["E501"]  # long lines in pre-existing code; tidy per file when touched
