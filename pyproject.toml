[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-hub"
version = "0.1.0"
description = "Unified home energy sensor aggregator"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "anker-solix-api",
]

[project.scripts]
energy-hub = "energy_hub.main:main"

[tool.uv.sources]
anker-solix-api = { path = "../anker-solix-api", editable = true }
